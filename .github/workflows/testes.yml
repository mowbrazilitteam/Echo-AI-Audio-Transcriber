# Em todo PR e em todo push na main: lint (Ruff), tipos (mypy) e testes (pytest), na CPU.
name: testes

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Bibliotecas do sistema para a janela Qt (importada nos testes)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy echo_ai tests
      - run: uv run pytest
      - name: Bibliotecas com falha de segurança conhecida (pip-audit)
        run: uv export --locked --no-hashes --no-emit-project --all-extras > requisitos.txt && uvx --from pip-audit==2.10.1 pip-audit -r requisitos.txt --disable-pip --no-deps
      - name: Segurança do código (Bandit)
        run: uvx --from bandit==1.9.4 bandit -q -r echo_ai -s B101,B404,B603
